<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo HTML Page</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --muted-color: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 2.5rem;
        }

        header {
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--muted-color);
            font-size: 1rem;
        }

        .card {
            background-color: #f1f5f9;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: center;
        }

        .counter-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 0.5rem 0;
        }

        .button-group {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-top: 1rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.97);
        }

        button.secondary {
            background-color: #e2e8f0;
            color: var(--text-color);
        }

        button.secondary:hover {
            background-color: #cbd5e1;
        }

        footer {
            text-align: center;
            font-size: 0.875rem;
            color: var(--muted-color);
            margin-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 1rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Hello, World! 👋</h1>
            <p class="subtitle">This is a modern, responsive HTML demo page with embedded CSS and JavaScript.</p>
        </header>

        <main>
            <div class="card">
                <h3>Interactive Counter</h3>
                <div class="counter-display" id="count">0</div>
                <div class="button-group">
                    <button id="decrementBtn" class="secondary">- Decrement</button>
                    <button id="resetBtn" class="secondary">Reset</button>
                    <button id="incrementBtn">+ Increment</button>
                </div>
            </div>
        </main>

        <footer>
            <p>Created as a demo HTML template &bull; Antigravity</p>
        </footer>
    </div>

    <script>
        let count = 0;
        const countDisplay = document.getElementById('count');
        const incrementBtn = document.getElementById('incrementBtn');
        const decrementBtn = document.getElementById('decrementBtn');
        const resetBtn = document.getElementById('resetBtn');

        function updateDisplay() {
            countDisplay.textContent = count;
        }

        incrementBtn.addEventListener('click', () => {
            count++;
            updateDisplay();
        });

        decrementBtn.addEventListener('click', () => {
            count--;
            updateDisplay();
        });

        resetBtn.addEventListener('click', () => {
            count = 0;
            updateDisplay();
        });
    </script>

</body>

</html>
